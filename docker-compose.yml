services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nursing-school-api
    network_mode: host
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=nursing_school;Username=nursing_user;Password=nursing_pass"
      Jpesa__Endpoint: "https://my.jpesa.com/api/"
      Jpesa__ApiKey: "${JPESA_API_KEY:-}"
      Jpesa__CallbackUrl: "${JPESA_CALLBACK_URL:-https://nursing.pameoinvestimentsltd.com/api/jpesa/callback}"
      Jpesa__Action: "${JPESA_ACTION:-credit}"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nursing-school-frontend
    network_mode: host
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads:
