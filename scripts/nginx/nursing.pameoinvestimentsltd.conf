# Nursing School — HTTPS → frontend on 127.0.0.1:3001
# Requires cert: /etc/letsencrypt/live/nursing.pameoinvestimentsltd.com/

upstream nursing_school_frontend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nursing.pameoinvestimentsltd.com;

    client_max_body_size 12M;

    access_log /var/log/nginx/nursing-school-access.log;
    error_log  /var/log/nginx/nursing-school-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot-nursing;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name nursing.pameoinvestimentsltd.com;

    ssl_certificate     /etc/letsencrypt/live/nursing.pameoinvestimentsltd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nursing.pameoinvestimentsltd.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12M;

    access_log /var/log/nginx/nursing-school-access.log;
    error_log  /var/log/nginx/nursing-school-error.log warn;

    location / {
        proxy_pass http://nursing_school_frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
