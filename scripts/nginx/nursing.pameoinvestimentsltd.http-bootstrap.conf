# STEP 1: HTTP until Let's Encrypt cert exists. App: 127.0.0.1:3001
# Run: sudo ./scripts/install-nginx.sh
# Then: sudo certbot certonly --webroot -w /var/www/certbot-nursing -d nursing.pameoinvestimentsltd.com
# Then: sudo ./scripts/install-nginx.sh --tls

upstream nursing_school_frontend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nursing.pameoinvestimentsltd.com;

    client_max_body_size 12M;

    access_log /var/log/nginx/nursing-school-access.log;
    error_log  /var/log/nginx/nursing-school-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot-nursing;
    }

    location / {
        proxy_pass http://nursing_school_frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
